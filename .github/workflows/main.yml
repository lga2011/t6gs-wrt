name: Build ImmortalWrt 25.12 - Qihoo 360 T6GS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-360t6gs.yml'

permissions:
  contents: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  MIRROR: https://mirrors.zju.edu.cn/immortalwrt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            python3-pyelftools \
            python3-yaml \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time

      # 3. Clone ImmortalWrt
      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt
          echo "===== ImmortalWrt version ====="
          git log -1 --oneline

      # 4. Install T6GS DTS
      - name: Add T6GS DTS
        working-directory: openwrt
        run: |
          cat > target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts <<'DTS'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          #include "mt7621.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
            compatible = "qihoo,360t6gs", "mediatek,mt7621-soc";
            model = "Qihoo 360 T6GS";

            aliases {
              led-boot = &led_status_red;
              led-failsafe = &led_status_red;
              led-running = &led_status_green;
              led-upgrade = &led_status_green;
              label-mac-device = &gmac0;
            };

            chosen {
              bootargs = "console=ttyS0,115200n8";
            };

            leds {
              compatible = "gpio-leds";

              led_status_red: sys_red {
                label = "red:sys";
                gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
              };

              led_status_green: sys_green {
                label = "green:sys";
                gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
              };

              led_status_blue: sys_blue {
                label = "blue:sys";
                gpios = <&gpio 10 GPIO_ACTIVE_LOW>;
              };
            };

            keys {
              compatible = "gpio-keys-polled";
              poll-interval = <20>;

              reset {
                label = "reset";
                gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
                linux,code = <KEY_RESTART>;
              };

              wps {
                label = "wps";
                gpios = <&gpio 6 GPIO_ACTIVE_LOW>;
                linux,code = <KEY_WPS_BUTTON>;
              };
            };
          };

          &nand {
            status = "okay";

            partitions {
              compatible = "fixed-partitions";
              #address-cells = <1>;
              #size-cells = <1>;

              partition@0 {
                label = "u-boot";
                reg = <0x000000 0x080000>;
                read-only;
              };

              partition@80000 {
                label = "u-boot-env";
                reg = <0x080000 0x040000>;
              };

              partition@c0000 {
                label = "Factory";
                reg = <0x0c0000 0x040000>;
                read-only;

                nvmem-layout {
                  compatible = "fixed-layout";
                  #address-cells = <1>;
                  #size-cells = <1>;

                  eeprom_factory: eeprom@0 {
                    reg = <0x0 0xe00>;
                  };

                  macaddr_factory_3fff4: macaddr@3fff4 {
                    reg = <0x3fff4 0x6>;
                  };

                  macaddr_factory_3fffa: macaddr@3fffa {
                    reg = <0x3fffa 0x6>;
                  };
                };
              };

              partition@180000 {
                label = "kernel";
                reg = <0x180000 0x400000>;
              };

              partition@580000 {
                label = "firmware";
                reg = <0x580000 0x7a80000>;
                compatible = "linux,ubi";
              };
            };
          };

          &pcie {
            status = "okay";
          };

          &pcie1 {
            wifi@0,0 {
              compatible = "mediatek,mt76";
              reg = <0x0000 0 0 0 0>;
              nvmem-cells = <&eeprom_factory>;
              nvmem-cell-names = "eeprom";
              mediatek,disable-radar-background;
            };
          };

          &gmac0 {
            status = "okay";
            nvmem-cells = <&macaddr_factory_3fff4>;
            nvmem-cell-names = "mac-address";
          };

          &gmac1 {
            status = "okay";
            label = "wan";
            nvmem-cells = <&macaddr_factory_3fffa>;
            nvmem-cell-names = "mac-address";

            fixed-link {
              speed = <1000>;
              full-duplex;
              pause;
            };
          };

          &switch0 {
            status = "okay";

            ports {
              port@0 {
                status = "okay";
                label = "lan1";
              };

              port@1 {
                status = "okay";
                label = "lan2";
              };

              port@2 {
                status = "okay";
                label = "lan3";
              };

              port@3 {
                status = "okay";
                label = "wan";
              };
            };
          };

          &state_default {
            gpio {
              groups = "jtag", "uart3", "wdt";
              function = "gpio";
            };
          };
          DTS

      # 5. Register T6GS NAND device
      - name: Register T6GS device
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("target/linux/ramips/image/mt7621.mk")
          data = path.read_text()

          if "Device/qihoo_360t6gs" in data:
              raise SystemExit(
                  "T6GS definition already exists; refusing duplicate registration"
              )

          device = """
          define Device/qihoo_360t6gs
              $(Device/nand)
              $(Device/uimage-lzma-loader)
              DEVICE_VENDOR := Qihoo
              DEVICE_MODEL := 360 T6GS
              DEVICE_DTS := mt7621_qihoo_360t6gs
              IMAGE_SIZE := 125000k
              # 明确同时生成 factory.bin 和 sysupgrade.bin
              IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size
              IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
              DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware
          endef
          TARGET_DEVICES += qihoo_360t6gs
          """

          path.write_text(data.rstrip() + "\n\n" + device.lstrip())
          print("T6GS device definition registered.")
          PY

      # 6. Initialize Feeds Configuration and Mirror
      - name: Configure Feeds and Mirror
        working-directory: openwrt
        run: |
          # 确保 feeds.conf 存在
          if [ ! -f feeds.conf ]; then
            if [ -f feeds.conf.default ]; then
              cp feeds.conf.default feeds.conf
            else
              echo "src-git packages https://github.com/immortalwrt/packages.git" > feeds.conf
              echo "src-git luci https://github.com/immortalwrt/luci.git" >> feeds.conf
              echo "src-git routing https://github.com/immortalwrt/routing.git" >> feeds.conf
              echo "src-git telephony https://github.com/immortalwrt/telephony.git" >> feeds.conf
            fi
          fi

          # 注意：不要把 github.com 替换为不兼容的自建/代理前缀，
          # 保持 feeds.conf 里的 github.com 地址不变，以防克隆失败。

          python3 - <<'PY'
          from pathlib import Path
          old = "https://downloads.immortalwrt.org"
          new = "https://mirrors.zju.edu.cn/immortalwrt"
          count = 0
          for root in (Path("package/base-files"), Path("target/linux")):
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      content = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if old in content:
                      path.write_text(content.replace(old, new))
                      count += 1
          print("Mirror replacement files:", count)
          PY

      # 7. Update feeds
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 8. Generate config
      - name: Generate firmware configuration
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y

          # APK package manager
          CONFIG_PACKAGE_apk-openssl=y

          # Base system
          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_fstools=y
          CONFIG_PACKAGE_libc=y
          CONFIG_PACKAGE_libgcc=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_logd=y
          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_procd-ujail=y
          CONFIG_PACKAGE_uci=y
          CONFIG_PACKAGE_uclient-fetch=y
          CONFIG_PACKAGE_urandom-seed=y
          CONFIG_PACKAGE_urngd=y
          CONFIG_PACKAGE_uboot-envtools=y

          # Network
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nf-nathelper=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          # Hardware
          CONFIG_PACKAGE_kmod-crypto-hw-eip93=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-leds-gpio=y

          # MediaTek WiFi (360 T6GS uses MT7915 AX1800)
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y

          # Wireless security
          CONFIG_PACKAGE_wpad-openssl=y

          # LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          # Utilities
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_autocore=y

          EOF

          make defconfig

      # 9. Verify configuration
      - name: Verify T6GS configuration
        working-directory: openwrt
        run: |
          echo "===== Target ====="
          grep 'CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y' .config

          echo "===== Package selection ====="
          for pkg in \
            apk-openssl \
            dnsmasq-full \
            default-settings-chn \
            kmod-mt7915e \
            kmod-mt7915-firmware \
            luci \
            luci-ssl \
            autocore
          do
            if grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "[OK] $pkg"
            else
              echo "[WARNING] $pkg unavailable or not selected"
            fi
          done

          grep -q \
            'CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y' \
            .config || exit 1

          cp .config .config.build

      # 10. Download source packages
      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8

      # 11. Compile
      - name: Compile ImmortalWrt
        working-directory: openwrt
        run: |
          echo "===== Build started ====="
          date
          make -j$(nproc) V=s
          echo "===== Build completed ====="
          date

      # 12. Verify images
      - name: Verify firmware
        working-directory: openwrt
        run: |
          DIR=bin/targets/ramips/mt7621
          test -d "$DIR"
          echo "===== Generated images ====="
          ls -lh "$DIR"

          # 使用通配符动态寻找对应文件
          INITRAMFS=$(ls "$DIR"/*-initramfs-kernel.bin 2>/dev/null || true)
          FACTORY=$(ls "$DIR"/*-factory.bin 2>/dev/null || true)
          SYSUPGRADE=$(ls "$DIR"/*-sysupgrade.bin 2>/dev/null || true)

          for f in "$INITRAMFS" "$FACTORY" "$SYSUPGRADE"; do
            if [ -z "$f" ] || [ ! -s "$f" ]; then
              echo "Missing or empty file matching pattern!"
              exit 1
            fi
            echo "[OK] $(basename "$f")"
          done

          cd "$DIR"
          sha256sum \
            "$(basename "$INITRAMFS")" \
            "$(basename "$FACTORY")" \
            "$(basename "$SYSUPGRADE")" > sha256sums.txt

          echo "===== SHA256 ====="
          cat sha256sums.txt

      # 13. Upload firmware
      - name: Upload T6GS firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-360T6GS-MT7621
          path: |
            openwrt/bin/targets/ramips/mt7621/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # 14. Upload config
      - name: Upload build configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6GS-Build-Config
          path: |
            openwrt/.config
            openwrt/.config.build
          if-no-files-found: ignore
          retention-days: 7
